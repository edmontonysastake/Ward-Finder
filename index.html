```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edmonton YSA Ward Finder</title>

    <!-- Leaflet map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Website styling -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Edmonton YSA Ward Finder</h1>

        <p>Enter an address to find your ward.</p>

        <div class="search">

            <input
                type="text"
                id="streetAddress"
                placeholder="Street address"
            >

            <input
                type="text"
                id="city"
                placeholder="City"
            >

            <button onclick="findWard()">
                Find My Ward
            </button>

        </div>

        <div id="result"></div>

        <div id="map"></div>

    </div>


    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- KML converter -->
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

    <!-- Our JavaScript -->
    <script src="app.js"></script>

</body>
</html>
